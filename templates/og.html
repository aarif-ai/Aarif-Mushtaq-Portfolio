{#
  Social preview image (1200×630), drawn as a web page and photographed by
  scripts/make_og.py with headless Chrome. DEV-ONLY: build.py never renders
  this file and it is never published, so inline <style> is fine here
  (the site's Content Security Policy doesn't apply).
  `root` is the project folder as a file:// URL, for fonts and the photo.
  Colours are the site's dark-theme tokens (static/css/site.css).
  Text from site.yaml: person.name, hero.eyebrow, hero.availability.
#}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Inter";
    src: url("{{ root }}/static/fonts/InterVariable-latin.woff2") format("woff2");
    font-weight: 400 700;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("{{ root }}/static/fonts/JetBrainsMono-latin.woff2") format("woff2");
    font-weight: 400 600;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #0a0e14; color: #e6edf3; font-family: "Inter", sans-serif; }

  /* soft teal glow behind the photo, faint indigo top-left */
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(520px 420px at 80% 50%, rgba(94, 234, 212, 0.13), transparent 70%),
      radial-gradient(620px 420px at 0% 0%, rgba(129, 140, 248, 0.09), transparent 70%);
  }
  .wrap {
    position: absolute; inset: 0 0 8px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 56px; padding: 0 88px;
  }
  .eyebrow {
    margin: 0 0 26px; color: #5eead4;
    font-family: "JetBrains Mono", monospace; font-size: 21px; letter-spacing: 0.01em;
    white-space: nowrap;
  }
  h1 {
    margin: 0 0 30px; font-size: 96px; font-weight: 700;
    line-height: 1; letter-spacing: -0.035em;
  }
  .availability {
    display: flex; align-items: flex-start; gap: 14px;
    margin: 0; color: #9aa7b6; font-size: 28px; line-height: 1.35;
  }
  .availability::before {
    content: ""; flex: none; width: 12px; height: 12px; margin-top: 0.5em;
    border-radius: 50%; background: #5eead4;
  }
  /* round photo, thin teal ring with a gap, soft glow — as in the hero */
  .photo {
    flex: none; width: 330px; height: 330px; border-radius: 50%;
    box-shadow: 0 0 0 8px #0a0e14, 0 0 0 10px #5eead4, 0 0 90px 18px rgba(94, 234, 212, 0.25);
  }
  /* thin teal → indigo line along the bottom */
  .line {
    position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
    background: linear-gradient(90deg, #5eead4, #818cf8);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div>
      <p class="eyebrow">{{ site.hero.eyebrow }}</p>
      <h1>{{ site.person.name }}</h1>
      <p class="availability">{{ site.hero.availability }}</p>
    </div>
    <img class="photo" src="{{ root }}/static{{ site.person.photo }}" alt="">
  </div>
  <div class="line"></div>
</body>
</html>
