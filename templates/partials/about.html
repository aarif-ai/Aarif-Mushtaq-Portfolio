{# About: paragraphs from site.yaml `about`. `italic` turns *title* into <em>. #}
{% set heading = (site.nav | selectattr("id", "equalto", "about") | first).label %}

<section id="about" class="section" aria-labelledby="about-title">
  <div class="container">
    <h2 id="about-title" class="section-title">{{ heading }}</h2>
    <div class="about-text">
      {% for paragraph in site.about %}
      <p class="reveal">{{ paragraph | italic }}</p>
      {% endfor %}
    </div>
  </div>
</section>
